[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["venv", "_archive", "chroma_db", "notebooks", "faiss_store", "faiss_sample"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines: the CSS-adjacent and prompt strings are readable as-is
    "E402",  # module-level import after sys.path manipulation is intentional here
    "UP006", # typing.List etc. are required while Python 3.9 is supported
    "UP035",
    "B008",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
