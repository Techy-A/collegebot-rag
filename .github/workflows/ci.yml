name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # The test suite is deliberately offline: no API key, no vector store.
      # It exercises retrieval logic, prompt assembly, citation formatting, the
      # factory's honesty contract and the rate-limit retry path with stubs.
      - name: Tests
        run: pytest tests/ -q
